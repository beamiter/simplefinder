name: CI

on:
  push:
  pull_request:

jobs:

  # The crate declares a minimum supported Rust version; a dependency bump or a
  # newly used language feature can quietly break it, because every other job
  # runs on stable.  This is the check that caught `ignore` pulling in
  # let-chains and two crates whose own sources had outgrown their declared
  # MSRV.  Keep the toolchain here in step with rust-version in Cargo.toml.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: Build on the declared minimum supported Rust
        run: cargo check --all-targets --locked
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo build --locked
      - run: vim -Nu NONE -i NONE -n -es -S tests/vim_smoke.vim
      - run: vim -Nu NONE -i NONE -n -es -S tests/vim_symbols.vim
      - name: Install Vim
        run: sudo apt-get update && sudo apt-get install --yes vim
      - name: Compile every Vim9 def (lazy compilation hides cold-branch errors)
        run: make defcompile
      - name: simplecore supervisor regression suite
        run: make vim-core
      - name: Verify the daemon capability handshake
        run: |
          response="$(printf '%s\n' '{"type":"ping","id":1}' | ./target/debug/simplefinder-daemon)"
          grep -F '"type":"pong"' <<<"$response"
          grep -F '"protocol_version":2' <<<"$response"
